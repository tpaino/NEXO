<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f8" />
  <title>NEXO — Presencia familiar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      color-scheme: light;
      --ink: #252830;
      --muted: #898d98;
      --glass: rgba(255, 255, 255, .64);
      --line: rgba(255, 255, 255, .82);
      --blue: #6f91c7;
      --coral: #d78c89;
      --green: #72a98a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      padding: clamp(10px, 2vw, 24px);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(183, 205, 235, .38), transparent 38%),
        radial-gradient(ellipse at 90% 88%, rgba(231, 205, 198, .28), transparent 34%),
        linear-gradient(145deg, #f8f9fb, #eff1f5 60%, #f5f3f2);
    }
    .app { display: flex; gap: clamp(10px, 1.5vw, 20px); width: 100%; height: 100%; }
    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(49, 58, 76, .08), inset 0 1px rgba(255,255,255,.92);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      backdrop-filter: blur(28px) saturate(145%);
    }
    .sidebar {
      width: min(320px, 30vw); min-width: 250px; flex: 0 0 auto;
      display: flex; flex-direction: column; gap: 18px; padding: 22px;
      border-radius: 28px; overflow-y: auto;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid rgba(37,40,48,.07); }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.04em; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 12px; color: var(--blue); background: rgba(111,145,199,.12); }
    .person { display: flex; align-items: center; gap: 12px; }
    .avatar { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #647d9f; background: linear-gradient(145deg, rgba(205,220,241,.85), rgba(255,255,255,.8)); }
    .person-name { font-size: 14px; font-weight: 600; letter-spacing: -.02em; }
    .subtle { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .section-label { margin: 1px 2px -8px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { min-width: 0; padding: 14px; border: 1px solid rgba(255,255,255,.8); border-radius: 20px; background: rgba(255,255,255,.43); box-shadow: inset 0 1px rgba(255,255,255,.8); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; }
    .metric-top i { color: var(--blue); font-size: 11px; }
    .metric-value { margin-top: 9px; font-size: clamp(20px, 2vw, 27px); font-weight: 600; letter-spacing: -.055em; line-height: 1; white-space: nowrap; }
    .unit { margin-left: 3px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0; }
    .wide { grid-column: 1 / -1; }
    .alert-card { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid rgba(215,140,137,.18); border-radius: 20px; background: rgba(245,224,220,.34); }
    .alert-icon { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 12px; color: var(--coral); background: rgba(215,140,137,.12); }
    .alert-title { font-size: 12px; font-weight: 600; }
    .alert-detail { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(37,40,48,.07); color: var(--muted); font-size: 10px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(114,169,138,.12); }
    main { position: relative; flex: 1; min-width: 0; overflow: hidden; border-radius: 28px; }
    #did-agent-container { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; background: radial-gradient(ellipse at 50% 35%, #fff, #f2f4f8 78%); }
    #did-agent-container > div, #did-agent-container iframe { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: inherit !important; }
    .connection { position: absolute; z-index: 2; top: 16px; right: 16px; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 999px; color: #5e6572; font-size: 11px; font-weight: 500; }
    .connection-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(114,169,138,.13); }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .app { flex-direction: column; }
      .sidebar { width: 100%; min-width: 0; height: auto; max-height: 48%; gap: 12px; padding: 16px; border-radius: 22px; }
      .brand { padding-bottom: 10px; }
      .section-label, .status { display: none; }
      .metric-grid { gap: 8px; }
      .metric { padding: 11px; border-radius: 16px; }
      .metric-value { margin-top: 6px; font-size: 21px; }
      .alert-card { padding: 10px 12px; }
      main { min-height: 180px; border-radius: 22px; }
      .connection { top: 10px; right: 10px; padding: 8px 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar glass" aria-label="Resumen de salud">
      <header class="brand">
        <span class="brand-name">NEXO</span>
        <span class="brand-mark" aria-hidden="true"><i class="fa-solid fa-wave-square"></i></span>
      </header>

      <section class="person" aria-label="Perfil">
        <span class="avatar" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
        <div>
          <div class="person-name">Camilo Benavides</div>
          <div class="subtle">Presencia familiar · SCL</div>
        </div>
      </section>

      <div class="section-label">Ahora</div>
      <section class="metric-grid" aria-label="Signos vitales">
        <div class="metric">
          <div class="metric-top"><span>Pulso</span><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i></div>
          <div class="metric-value"><span id="val-bpm">88</span><span class="unit">lpm</span></div>
        </div>
        <div class="metric">
          <div class="metric-top"><span>Presión</span><i class="fa-solid fa-wave-square" aria-hidden="true"></i></div>
          <div class="metric-value" style="font-size:21px"><span id="val-bp">138/86</span></div>
        </div>
        <div class="metric">
          <div class="metric-top"><span>Glucosa</span><i class="fa-solid fa-droplet" aria-hidden="true"></i></div>
          <div class="metric-value"><span id="val-glucose">114</span><span class="unit">mg/dL</span></div>
        </div>
        <div class="metric">
          <div class="metric-top"><span>Oxígeno</span><i class="fa-solid fa-lungs" aria-hidden="true"></i></div>
          <div class="metric-value"><span id="val-spo2">96</span><span class="unit">%</span></div>
        </div>
        <div class="metric wide">
          <div class="metric-top"><span>Temperatura</span><i class="fa-solid fa-temperature-half" aria-hidden="true"></i></div>
          <div class="metric-value"><span id="val-body-temp">36.8</span><span class="unit">°C</span></div>
        </div>
      </section>

      <section class="alert-card" aria-label="Aviso de cortisol">
        <span class="alert-icon" aria-hidden="true"><i class="fa-solid fa-heart-pulse"></i></span>
        <div>
          <div class="alert-title">Cortisol elevado <span id="val-cortisol" style="font-weight:500;color:var(--muted)">26.4</span></div>
          <div class="alert-detail">Requiere atención</div>
        </div>
      </section>

      <footer class="status"><span class="status-dot" aria-hidden="true"></span><span>Sensor conectado</span></footer>
    </aside>

    <main class="glass" aria-label="Presencia digital">
      <div id="did-agent-container"></div>
      <div class="connection glass"><span class="connection-dot" aria-hidden="true"></span><span>Conectado · Matías</span></div>
    </main>
  </div>

  <script type="module"
        src="https://agent.d-id.com/v2/index.js"
        data-mode="full"
        data-client-key="ck_iQpdzzJtH1hTSKS4k1wYV"
        data-agent-id="v2_agt_eN8mqxlY"
        data-name="did-agent"
        data-monitor="true"
        data-light-mode="true"
        data-target-id="did-agent-container">
  </script>

  <script>
    const metrics = { bpm: 88, sys: 138, dia: 86, cortisol: 26.4, glucose: 114 };
    setInterval(() => {
      metrics.bpm = Math.max(84, Math.min(93, metrics.bpm + Math.floor(Math.random() * 3) - 1));
      metrics.sys = Math.max(135, Math.min(142, metrics.sys + Math.floor(Math.random() * 3) - 1));
      metrics.dia = Math.max(84, Math.min(89, metrics.dia + Math.floor(Math.random() * 3) - 1));
      metrics.cortisol = Math.max(25.8, Math.min(27.2, +(metrics.cortisol + (Math.random() * .2 - .1)).toFixed(1)));
      metrics.glucose = Math.max(112, Math.min(117, metrics.glucose + Math.floor(Math.random() * 3) - 1));
      document.getElementById('val-bpm').textContent = metrics.bpm;
      document.getElementById('val-bp').textContent = `${metrics.sys}/${metrics.dia}`;
      document.getElementById('val-cortisol').textContent = metrics.cortisol.toFixed(1);
      document.getElementById('val-glucose').textContent = metrics.glucose;
    }, 3200);
  </script>
</body>
</html>
